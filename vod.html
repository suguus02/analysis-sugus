const DB={rv:{},mk:{},loaded:false};
try{const c=JSON.parse(ls.get('tvt:vod','{}'));DB.rv=c.rv||{};DB.mk=c.mk||{}}catch(e){}
const cache=()=>ls.set('tvt:vod',JSON.stringify({rv:DB.rv,mk:DB.mk}));
let Q={};try{Q=JSON.parse(ls.get('tvt:vodq','{}'))}catch(e){Q={}}
const saveQ=()=>ls.set('tvt:vodq',JSON.stringify(Q));
async function load(){
  try{const j=await post({action:'read',id:'',sheet:'DRAFT PREP',range:'',headers:'1',tq:'select *'});
    if(!j||!j.ok)throw new Error(j&&j.error||'read');
    const rv={},mk={};
    for(const r of (j.rows||[]).slice(1)){const k=String(r[0]||'');if(!/^vodm?\|/.test(k))continue;let o=null;try{o=JSON.parse(r[1]||'null')}catch(e){}if(!o)continue;
      o.upd=r[2]||o.upd||'';o.by=o.by||r[3]||'';
      if(k.startsWith('vod|')){if(!o.del)rv[o.id]=o}else{const p=k.split('|');(mk[p[1]]=mk[p[1]]||{})[p[2]]=o}}
    // keep the changes that have not reached the sheet yet
    for(const k in Q){const o=Q[k];if(k.startsWith('vod|')){if(o.del)delete rv[o.id];else rv[o.id]=o}else{const p=k.split('|');(mk[p[1]]=mk[p[1]]||{})[p[2]]=o}}
    DB.rv=rv;DB.mk=mk;DB.loaded=true;DB.err='';cache()}
  catch(e){DB.loaded=true;DB.err=e&&e.message==='session'?'Your session ended: sign in again on the page.':'Could not reach the sheet (showing what this browser has saved).'}
  flush()}
let _fl=0;
async function flush(){if(_fl)return;_fl=1;
  try{for(const k of Object.keys(Q)){const o=Q[k];try{const j=await post({action:'prep',key:k,json:JSON.stringify(o),base:'',by:USER});if(j&&j.ok){if(Q[k]===o)delete Q[k];saveQ()}else if(j&&j.error==='session'){toast('Your session ended: sign in again on the page.',5000);break}}catch(e){break}}}
  finally{_fl=0;setSaved()}}
let _flT=0;
function put(k,o){o.by=USER;o.upd=new Date().toISOString();Q[k]=o;saveQ();cache();setSaved('saving');clearTimeout(_flT);_flT=setTimeout(flush,900)}
function setSaved(s){const e=$('#svst');if(!e)return;const n=Object.keys(Q).length;e.textContent=s==='saving'||n?'Saving…':'All changes saved';e.style.color=n?'#facc15':''}
setInterval(()=>{if(Object.keys(Q).length)flush()},20000);

const P={kind:'',v:null,yt:null,ready:false,
  play(){if(this.kind==='file')this.v.play();else if(this.yt&&this.ready)this.yt.playVideo()},
  pause(){if(this.kind==='file')this.v.pause();else if(this.yt&&this.ready)this.yt.pauseVideo()},
  paused(){if(this.kind==='file')return this.v.paused;if(this.yt&&this.ready){const s=this.yt.getPlayerState();return s!==1&&s!==3}return true},
  toggle(){this.paused()?this.play():this.pause()},
  time(){if(this.kind==='file')return this.v.currentTime||0;if(this.yt&&this.ready)return this.yt.getCurrentTime()||0;return 0},
  dur(){if(this.kind==='file')return this.v.duration||0;if(this.yt&&this.ready)return this.yt.getDuration()||0;return 0},
  seek(t){t=Math.max(0,Math.min(this.dur()||t,t));if(this.kind==='file')this.v.currentTime=t;else if(this.yt&&this.ready)this.yt.seekTo(t,true)},
  rate(r){if(this.kind==='file')this.v.playbackRate=r;else if(this.yt&&this.ready)this.yt.setPlaybackRate(r)},
  frame(){return this.kind==='file'?1/30:.1},
  destroy(){try{if(this.yt)this.yt.destroy()}catch(e){}if(this.v&&this.v.src&&this.v.src.startsWith('blob:'))URL.revokeObjectURL(this.v.src);this.kind='';this.v=null;this.yt=null;this.ready=false}};

let _nt=0;document.addEventListener('input',e=>{if(e.target.id!=='mnote')return;const m=DB.mk[S.rid]&&DB.mk[S.rid][S.sel];if(!m)return;m.note=e.target.value;clearTimeout(_nt);_nt=setTimeout(()=>saveMark(m),700)});
// ---------------- timeline
function drawTL(){const tl=$('#tl');if(!tl)return;const d=P.dur()||Math.max(60,...marks().map(m=>m.t+10));const V=new Set(visible().map(m=>m.id));
  tl.querySelectorAll('i,em').forEach(e=>e.remove());
  const step=d>1800?300:d>600?120:d>240?60:30;let h='';for(let s=step;s<d;s+=step)h+=`<em style="left:${100*s/d}%">${fmt(s)}</em>`;
  h+=marks().map(m=>`<i data-tlm="${m.id}" class="${m.id===S.sel?'on':''}${V.has(m.id)?'':' dim'}" style="left:${100*m.t/d}%;background:${(TY[m.ty]||TY.note).c}" title="${fmt(m.t)} · ${esc((TY[m.ty]||TY.note).n)}${m.note?' · '+esc(m.note.slice(0,60)):''}"></i>`).join('');
  tl.insertAdjacentHTML('beforeend',h)}
document.addEventListener('click',e=>{const tl=e.target.closest&&e.target.closest('#tl');if(!tl)return;const i=e.target.closest('[data-tlm]');if(i){selMark(i.dataset.tlm,true);return}
  const r=tl.getBoundingClientRect(),d=P.dur();if(d){P.seek(d*(e.clientX-r.left)/r.width);if(S.sel){S.sel='';renderSide();drawTL()}}});
// ---------------- drawing (coordinates 0..1 of the image, so they fit any screen size)
function bindStage(){
  const st=$('#stage'),cv=$('#cv');
  $('#hit').onclick=()=>P.toggle();
  $('#tools').onclick=e=>{const b=e.target.closest('button,[data-col]');if(!b)return;
    if(b.dataset.col){S.col=b.dataset.col;syncTools();return}
    if(b.dataset.tool){S.tool=S.tool===b.dataset.tool?'':b.dataset.tool;if(S.tool){P.pause();ensureMarkForDrawing()}syncTools();return}
    const m=curMark();if(!m)return;
    if(b.dataset.act==='undo'&&m.dr&&m.dr.length){m.dr.pop();saveMark(m);renderSide();paint()}
    if(b.dataset.act==='clear'&&m.dr&&m.dr.length&&confirm('Clear the drawing of this mark?')){m.dr=[];saveMark(m);renderSide();paint()}};
  syncTools();
  const pt=e=>{const r=cv.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]};
  cv.onpointerdown=e=>{if(!S.tool)return;const m=ensureMarkForDrawing();if(!m)return;e.preventDefault();
    if(S.tool==='text'){const s=prompt('Text');if(s){m.dr=m.dr||[];m.dr.push({k:'text',c:S.col,p:[pt(e)],s:s.slice(0,80)});saveMark(m);renderSide();paint()}return}
    cv.setPointerCapture(e.pointerId);S.draft={k:S.tool,c:S.col,p:[pt(e),pt(e)]};paint()};
  cv.onpointermove=e=>{if(!S.draft)return;if(S.draft.k==='pen')S.draft.p.push(pt(e));else S.draft.p[1]=pt(e);paint()};
  cv.onpointerup=()=>{if(!S.draft)return;const m=curMark(),d=S.draft;S.draft=null;
    const big=Math.abs(d.p[0][0]-d.p[d.p.length-1][0])+Math.abs(d.p[0][1]-d.p[d.p.length-1][1])>.01||d.p.length>4;
    if(m&&big){if(d.k==='pen'&&d.p.length>120)d.p=d.p.filter((_,i)=>i%Math.ceil(d.p.length/120)===0);d.p=d.p.map(q=>[+q[0].toFixed(4),+q[1].toFixed(4)]);m.dr=m.dr||[];m.dr.push(d);saveMark(m);renderSide()}paint()};
  new ResizeObserver(()=>paint()).observe(st)}
function syncTools(){document.querySelectorAll('#tools [data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===S.tool));document.querySelectorAll('#tools [data-col]').forEach(b=>b.classList.toggle('on',b.dataset.col===S.col));const st=$('#stage');if(st)st.classList.toggle('draw',!!S.tool)}
function curMark(){return S.sel&&DB.mk[S.rid]&&DB.mk[S.rid][S.sel]||null}
function ensureMarkForDrawing(){let m=curMark();if(m)return m;if(!P.kind){toast('Open the video first');return null}addMark('note');toast('New Note mark: the drawing is saved with it');return curMark()}
function paint(){const cv=$('#cv');if(!cv)return;const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;
  if(cv.width!==Math.round(r.width*dpr)||cv.height!==Math.round(r.height*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,r.width,r.height);
  const m=curMark(),show=m&&(P.paused()||Math.abs(P.time()-m.t)<1.5);
  const L=(show&&m.dr?m.dr:[]).concat(S.draft?[S.draft]:[]);
  const W=r.width,H=r.height,lw=Math.max(2.5,W/320);
  for(const d of L){g.strokeStyle=g.fillStyle=d.c;g.lineWidth=lw;g.lineCap=g.lineJoin='round';const p=d.p.map(q=>[q[0]*W,q[1]*H]);
    if(d.k==='arrow'){const [a,b]=[p[0],p[p.length-1]];g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();const an=Math.atan2(b[1]-a[1],b[0]-a[0]),hl=lw*5;g.beginPath();g.moveTo(b[0],b[1]);g.lineTo(b[0]-hl*Math.cos(an-.45),b[1]-hl*Math.sin(an-.45));g.lineTo(b[0]-hl*Math.cos(an+.45),b[1]-hl*Math.sin(an+.45));g.closePath();g.fill()}
    else if(d.k==='circle'){const [a,b]=[p[0],p[p.length-1]];g.beginPath();g.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.abs(b[0]-a[0])/2||1,Math.abs(b[1]-a[1])/2||1,0,0,7);g.globalAlpha=.14;g.fill();g.globalAlpha=1;g.stroke()}
    else if(d.k==='rect'){const [a,b]=[p[0],p[p.length-1]];g.setLineDash([lw*3,lw*2]);g.strokeRect(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]));g.setLineDash([]);g.globalAlpha=.1;g.fillRect(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]));g.globalAlpha=1}
    else if(d.k==='pen'){g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke()}
    else if(d.k==='text'){const fs=Math.max(14,W/42);g.font='700 '+fs+'px SgInter,sans-serif';g.lineWidth=fs/5;g.strokeStyle='rgba(0,0,0,.75)';g.strokeText(d.s,p[0][0],p[0][1]);g.fillText(d.s,p[0][0],p[0][1])}}}
// ---------------- controls, keys and the clock
document.addEventListener('click',e=>{if(!view)return;const b=e.target.closest&&e.target.closest('[data-sk],[data-rate],[data-add],#pp,#prevM,#nextM');if(!b)return;
  if(b.id==='pp')return P.toggle();
  if(b.id==='prevM'||b.id==='nextM')return jump(b.id==='nextM'?1:-1);
  if(b.dataset.add)return addMark(b.dataset.add);
  if(b.dataset.rate){S.rate=+b.dataset.rate;P.rate(S.rate);return}
  const k=b.dataset.sk;P.pause&&k.includes('f')&&P.pause();P.seek(P.time()+(k==='f'?P.frame():k==='-f'?-P.frame():+k))});
function jump(dir){const L=visible(),t=P.time();const m=dir>0?L.find(x=>x.t>t+.25):[...L].reverse().find(x=>x.t<t-.25);if(m)selMark(m.id,true)}
document.addEventListener('keydown',e=>{if(!view||e.ctrlKey&&e.key!=='z'||e.metaKey||e.altKey)return;const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){if(e.key==='Escape')a.blur();return}
  if(document.querySelector('.ov'))return;
  const k=e.key;
  if(e.ctrlKey&&k==='z'){const m=curMark();if(m&&m.dr&&m.dr.length){m.dr.pop();saveMark(m);renderSide();paint()}e.preventDefault();return}
  if(k===' '){e.preventDefault();P.toggle();return}
  if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();P.seek(P.time()+(k==='ArrowLeft'?-5:5));return}
  if(k===','||k==='.'){P.pause();P.seek(P.time()+(k===','?-1:1)*P.frame());return}
  if(k==='['||k===']'){jump(k===']'?1:-1);return}
  if(k==='Escape'){S.tool='';syncTools();if(S.sel){S.sel='';renderSide();drawTL();paint()}return}
  const tl={a:'arrow',c:'circle',z:'rect',f:'pen',t:'text'}[k.toLowerCase()];if(tl){S.tool=S.tool===tl?'':tl;if(S.tool){P.pause();ensureMarkForDrawing()}syncTools();return}
  const ty=TYPES.find(t=>t[2]===k.toUpperCase());if(ty){e.preventDefault();addMark(ty[0])}});
let _lastD=0;
(function loop(){if(view&&$('#tm')){const t=P.time(),d=P.dur();$('#tm').textContent=fmt(t)+' / '+fmt(d);const pl=$('#plh');if(pl)pl.style.width=(d?100*t/d:0)+'%';
  const pp=$('#pp');if(pp)pp.textContent=P.paused()?'▶':'❚❚';
  document.querySelectorAll('[data-rate]').forEach(b=>b.classList.toggle('on',+b.dataset.rate===S.rate));
  if(d&&d!==_lastD){_lastD=d;drawTL()}
  const m=curMark();const hud=$('#hud');if(hud){const ty=m&&TY[m.ty];hud.innerHTML=`<span>${fmt(t)}</span>${m?`<span style="color:${ty.c}">● ${ty.n.toUpperCase()}${m.pl?' · '+esc(m.pl):''}</span>`:''}${S.tool?'<span style="color:#c4b5fd">DRAWING · Esc to stop</span>':''}`}
  if(!P.paused()&&m&&Math.abs(t-m.t)>1.5&&!S.tool){S.sel='';renderSide();drawTL()}
  if(!P.paused()||S.draft)paint()}
  requestAnimationFrame(loop)})();
// ---------------- start: what this browser has, then the sheet (and again every minute for teammates' marks)
route();
load().then(()=>{if(view){const ta=document.activeElement&&document.activeElement.id==='mnote';if(!DB.rv[view.rid]){location.hash='';return}if(!ta){renderSide();drawTL();paint()}}else route()});
setInterval(()=>{if(document.hidden)return;const ta=document.activeElement&&/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);if(ta||S.draft)return;load().then(()=>{if(view){if(DB.rv[view.rid]){renderSide();drawTL();paint()}}else renderLib()})},60000);
// the theme button of the page, next to the account name
setTimeout(()=>{const b=document.getElementById('tqTheme'),s=document.getElementById('thSlot');if(b&&s)s.appendChild(b)},300);
})();
</script>
