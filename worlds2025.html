// ====== data engine: games -> sets ======
let D=null;           // processed data
function process(P,Q){
  const TEAMS=Q.map(r=>({n:String(r[0]).trim().toUpperCase(),tags:[r[2],r[4],r[6]].map(x=>String(x).trim().toUpperCase()).filter(Boolean),reg:String(r[7]||'').trim()})).filter(t=>t.n);
  const TAG={},REG={};TEAMS.forEach(t=>{REG[t.n]=t.reg;t.tags.forEach(x=>TAG[x]=t.n)});
  const isW=n=>!!REG[n];
  const teamOf=tags=>{const c={};let best=null,bn=0;tags.forEach(x=>{const t=TAG[String(x).trim().toUpperCase()];if(t){c[t]=(c[t]||0)+1;if(c[t]>bn){bn=c[t];best=t}}});
    if(bn>=2)return best;const k=tags.map(x=>String(x).trim().toUpperCase()).filter(Boolean).sort();return k.length===3?'~'+k.join(','):null};
  let prev=0;
  const G=[];
  for(const r of P){
    const ds=String(r[0]).split('-');if(ds.length!==3)continue;
    const d0=new Date(+ds[2],+ds[1]-1,+ds[0]).getTime()/1000;
    let t;const hm=String(r[17]||'').split(':');
    if(hm.length>=2&&hm[0]!==''){t=d0+(+hm[0])*3600+(+hm[1])*60+(+hm[2]||0);prev=t}else{t=prev>=d0?prev+300:d0+43200;prev=t}
    let a=teamOf([r[4],r[5],r[6]]),b=teamOf([r[10],r[11],r[12]]);
    if(!a||!b||a===b)continue;if(!isW(a)&&!isW(b))continue;
    let y=r[3]==='victory'?1:r[3]==='defeat'?0:.5,ba=[r[7],r[8],r[9]].map(x=>String(x).trim().toUpperCase()).sort(),bb=[r[13],r[14],r[15]].map(x=>String(x).trim().toUpperCase()).sort();
    if(a>b){[a,b]=[b,a];[ba,bb]=[bb,ba];y=1-y}
    G.push({t,d0,m:String(r[2]).trim(),mode:String(r[1]).trim(),a,b,ba,bb,y,ty:String(r[16]).trim().toLowerCase()==='tournament'?'T':'F'});
  }
  G.sort((x,z)=>x.t-z.t);
  // the same game seen by several players -> once
  const U=[],last={};
  for(const g of G){const k=g.a+'|'+g.b+'|'+g.m+'|'+g.ba+'|'+g.bb;const o=last[k];
    if(o&&g.t-o.t<120){if(g.ty==='T')o.ty='T';continue}last[k]=g;U.push(g)}
  // sets: same two teams, same map, first to 2 wins
  const S=[],open={};
  for(const g of U){const k=g.a+'|'+g.b;let s=open[k];
    if(s&&(s.m!==g.m||g.t-s.end>1800||s.w>=2||s.l>=2))s=null;
    if(!s){s={t:g.t,d0:g.d0,end:g.t,m:g.m,mode:g.mode,a:g.a,b:g.b,w:0,l:0,ty:g.ty,g:[]};S.push(s);open[k]=s}
    s.g.push(g);s.end=g.t;if(g.ty==='T')s.ty='T';if(g.y===1)s.w++;else if(g.y===0)s.l++}
  S.forEach(s=>{s.y=s.w>s.l?1:s.l>s.w?0:null;s.wc=s.ty==='T'&&s.t>=CUT;s.pre=s.t<CUT});
  // Worlds sets the API saw only partly (1-1 or 1-0): the Liquipedia series score decides them when it is unambiguous
  let fixed=0;
  for(const [A,B,sa,sb,dd] of SERIES){const a=A<B?A:B,b=A<B?B:A,wa=A<B?sa:sb,wb=A<B?sb:sa;
    const L=S.filter(s=>s.wc&&s.a===a&&s.b===b&&new Date(s.t*1000).getDate()===dd);
    let ga=0,gb=0;const und=[];L.forEach(s=>{if(s.w>=2)ga++;else if(s.l>=2)gb++;else und.push(s)});
    const ma=wa-ga,mb=wb-gb;
    if(ma>=0&&mb>=0&&und.length===ma+mb){
      // sets leaning to one side (1-0) go to that side, level sets (1-1, 0-0) fill what is left; only if it fits exactly
      const la=und.filter(s=>s.w>s.l),lb=und.filter(s=>s.l>s.w),lv=und.filter(s=>s.w===s.l);
      if(la.length<=ma&&lb.length<=mb&&(ma-la.length===0||mb-lb.length===0)){const toA=ma-la.length>0;
        la.forEach(s=>{s.y=1;s.fix=1;fixed++});lb.forEach(s=>{s.y=0;s.fix=1;fixed++});lv.forEach(s=>{s.y=toA?1:0;s.fix=1;fixed++})}}}
  const W=TEAMS.map(t=>t.n);
  D={TEAMS,REG,W,isW,S,U,fixed,games:G.length};
  D.check=SERIES.map(([A,B,sa,sb,dd])=>{const a=A<B?A:B,b=A<B?B:A;const L=S.filter(s=>s.wc&&s.a===a&&s.b===b&&new Date(s.t*1000).getDate()===dd&&s.y!=null);
    const x=L.filter(s=>s.y===1).length,z=L.filter(s=>s.y===0).length;const [xa,xb]=A<B?[x,z]:[z,x];return {A,B,sa,sb,xa,xb,ok:xa===sa&&xb===sb}});
  stats();
}
const mine=(s,t)=>s.a===t?s.y:1-s.y;
function wrOf(L,t){const v=L.filter(s=>s.y!=null);if(!v.length)return {p:null,n:0};return {p:v.reduce((a,s)=>a+mine(s,t),0)/v.length,n:v.length,w:v.reduce((a,s)=>a+mine(s,t),0)}}
function rating(sets){ // Bradley-Terry with recency, tournament x2 (same idea as the Rating leaderboard)
  const G=sets.filter(s=>s.y!=null).map(s=>[s.a,s.b,s.y,Math.pow(.5,(CUT-s.t)/86400/HALF)*(s.ty==='T'?2:1)]);
  const T=[...new Set(G.flatMap(g=>[g[0],g[1]]))],r={};T.forEach(t=>r[t]=0);
  for(let it=0;it<150;it++){const gr={},hs={};T.forEach(t=>{gr[t]=-r[t]*.5;hs[t]=.5});
    for(const [a,b,y,w] of G){const p=1/(1+Math.exp(r[b]-r[a]));gr[a]+=w*(y-p);gr[b]-=w*(y-p);hs[a]+=w*p*(1-p);hs[b]+=w*p*(1-p)}
    T.forEach(t=>r[t]+=gr[t]/hs[t])}
  const In=D.W.filter(t=>r[t]!=null),mo=In.reduce((a,t)=>a+r[t],0)/(In.length||1),o={};D.W.forEach(t=>o[t]=r[t]==null?null:Math.round(1500+173.7*(r[t]-mo)));return o}
function corr(xs,ys){const n=xs.length;if(n<3)return 0;const mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;let c=0,vx=0,vy=0;for(let i=0;i<n;i++){c+=(xs[i]-mx)*(ys[i]-my);vx+=(xs[i]-mx)**2;vy+=(ys[i]-my)**2}return vx&&vy?c/Math.sqrt(vx*vy):0}
function stats(){
  const pre=D.S.filter(s=>s.pre),preW=pre.filter(s=>D.isW(s.a)&&D.isW(s.b));
  D.RA=rating(pre);D.RW=rating(preW);
  D.rows=D.W.map(t=>{const mineS=L=>L.filter(s=>s.a===t||s.b===t);
    const a=wrOf(mineS(pre),t),w=wrOf(mineS(preW),t),c=wrOf(mineS(D.S.filter(s=>s.wc)),t);
    let sw=0,sl=0;SERIES.forEach(([A,B,sa,sb])=>{if(A===t){sa>sb?sw++:sl++}else if(B===t){sb>sa?sw++:sl++}});
    const pl=PLACE[t]||['–',99];
    return {t,reg:D.REG[t],a,w,c,ser:[sw,sl],pl:pl[0],pr:pl[1],ra:D.RA[t],rw:D.RW[t]}});
}
function view(){const vs=UI.vs==='w';return D.rows.map(r=>{const b=vs?r.w:r.a;return {...r,b,d:(r.c.p!=null&&b.p!=null)?r.c.p-b.p:null,rt:vs?r.rw:r.ra}})}

function scatter(R){
  const W=560,H=440,P=58,lo=Math.min(.2,...R.map(r=>r.b.p))-.02,hi=Math.max(.8,...R.map(r=>r.b.p))+.02,ylo=0,yhi=1;
  const X=v=>P+(v-lo)/(hi-lo)*(W-P-18),Y=v=>H-P-(v-ylo)/(yhi-ylo)*(H-P-18);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" class="sc"><rect x="${P}" y="18" width="${W-P-18}" height="${H-P-18}" fill="#16140d" rx="10"/>`;
  for(let v=Math.ceil(lo*10)/10;v<=hi+1e-9;v+=.1)s+=`<line x1="${X(v)}" x2="${X(v)}" y1="18" y2="${H-P}" stroke="#2a2618"/><text x="${X(v)}" y="${H-P+18}" fill="#8a8370" font-size="11" text-anchor="middle">${Math.round(v*100)}%</text>`;
  for(let v=0;v<=1.0001;v+=.2)s+=`<line x1="${P}" x2="${W-18}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a2618"/><text x="${P-8}" y="${Y(v)+4}" fill="#8a8370" font-size="11" text-anchor="end">${Math.round(v*100)}%</text>`;
  const d0=Math.max(lo,ylo),d1=Math.min(hi,yhi);
  s+=`<line x1="${X(d0)}" y1="${Y(d0)}" x2="${X(d1)}" y2="${Y(d1)}" stroke="#facc15" stroke-dasharray="6 5" stroke-width="1.5" opacity=".75"/>
<text x="${P+14}" y="38" fill="#4ade80" font-size="12" font-weight="700">▲ Better at Worlds</text><text x="${W-30}" y="${H-P-12}" fill="#f87171" font-size="12" font-weight="700" text-anchor="end">▼ Worse at Worlds</text>
<text x="${(W+P)/2}" y="${H-8}" fill="#d6d3c4" font-size="12" text-anchor="middle" font-weight="600">Win rate before Worlds</text><text x="14" y="${(H-P)/2+9}" fill="#d6d3c4" font-size="12" text-anchor="middle" font-weight="600" transform="rotate(-90 14 ${(H-P)/2+9})">Win rate at Worlds</text>`;
  R.slice().sort((a,b)=>Math.abs(a.d)-Math.abs(b.d)).forEach(r=>{const x=X(r.b.p),y=Y(r.c.p),src=logoSrc(r.t);
    s+=`<g class="dotg" data-team="${esc(r.t)}"><title>${esc(r.t)}: ${pc(r.b.p)} before → ${pc(r.c.p)} at Worlds</title><circle cx="${x}" cy="${y}" r="16" fill="#0f0e09" stroke="${r.d>0?'#4ade80':r.d<0?'#f87171':'#a8a29e'}" stroke-width="2"/>${src?`<image href="${src}" x="${x-11}" y="${y-11}" width="22" height="22"/>`:`<text x="${x}" y="${y+4}" fill="#fff" font-size="9" text-anchor="middle">${esc(r.t.slice(0,3))}</text>`}</g>`});
  return s+'</svg>'}

function brStats(t,sets){const c={};let n=0;sets.forEach(s=>s.g.forEach(g=>{n++;const my=g.a===t?g.ba:g.bb,y=g.a===t?g.y:1-g.y;my.forEach(b=>{const e=c[b]||(c[b]={n:0,w:0});e.n++;e.w+=y})}));
  return {n,L:Object.entries(c).map(([b,e])=>({b,n:e.n,p:e.n/n,wr:e.w/e.n})).sort((x,z)=>z.n-x.n)}}
function mapStats(t,sets){const c={};sets.filter(s=>s.y!=null).forEach(s=>{const e=c[s.m]||(c[s.m]={n:0,w:0,mode:s.mode});e.n++;e.w+=mine(s,t)});return Object.entries(c).map(([m,e])=>({m,n:e.n,w:e.w,wr:e.w/e.n,mode:e.mode}))}
function popup(t){
  const r=view().find(x=>x.t===t);if(!r)return '';
  const all=D.S.filter(s=>s.a===t||s.b===t),pre=all.filter(s=>s.pre&&(UI.vs==='a'||(D.isW(s.a)&&D.isW(s.b)))),wc=all.filter(s=>s.wc);
  // daily win rate
  const days=[];for(let d=1;d<=30;d++){const d0=new Date(2025,10,d).getTime()/1000;const L=(d0>=CUT?wc:pre).filter(s=>s.d0===d0&&s.y!=null);if(L.length)days.push({d,n:L.length,p:L.reduce((a,s)=>a+mine(s,t),0)/L.length,wc:d0>=CUT})}
  const W=1080,H=200,P=42,X=d=>P+(d-1)*(W-P-24)/29,Y=v=>H-28-v*(H-50);
  let ch=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;[0,.5,1].forEach(v=>ch+=`<line x1="${P}" x2="${W-24}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a2618" ${v===.5?'stroke-dasharray="4 4"':''}/><text x="${P-8}" y="${Y(v)+4}" fill="#8a8370" font-size="11" text-anchor="end">${v*100}%</text>`);
  ch+=`<rect x="${X(27.5)}" y="12" width="${X(30)-X(27.5)+14}" height="${H-38}" fill="#facc15" opacity=".08" rx="8"/><text x="${X(30)+10}" y="27" fill="#facc15" font-size="11" font-weight="700" text-anchor="end">WORLDS</text>`;
  for(let d=1;d<=30;d+=3)ch+=`<text x="${X(d)}" y="${H-8}" fill="#8a8370" font-size="10.5" text-anchor="middle">${d}/11</text>`;
  const pd=days.filter(x=>!x.wc),wd=days.filter(x=>x.wc);
  if(pd.length>1)ch+=`<polyline fill="none" stroke="#facc15" stroke-width="2.5" points="${pd.map(x=>X(x.d)+','+Y(x.p)).join(' ')}"/>`;
  if(wd.length>1)ch+=`<polyline fill="none" stroke="#facc15" stroke-width="2.5" stroke-dasharray="2 4" points="${wd.map(x=>X(x.d)+','+Y(x.p)).join(' ')}"/>`;
  days.forEach(x=>ch+=`<circle cx="${X(x.d)}" cy="${Y(x.p)}" r="${x.wc?6:4.5}" fill="${x.wc?'#facc15':'#0c0b07'}" stroke="#facc15" stroke-width="2"><title>${x.d}/11: ${pc(x.p)} in ${x.n} sets${x.wc?' (Worlds)':''}</title></circle>`);
  ch+='</svg>';
  // brawlers
  const B0=brStats(t,pre),B1=brStats(t,wc),p0={};B0.L.forEach(x=>p0[x.b]=x.p);
  const brRow=(L,isW)=>L.slice(0,8).map(x=>`<div class="br">${bimg(x.b)}<div><b>${esc(title(x.b))}</b><small>${pc(x.p)} of games${isW?` · before ${pc(p0[x.b]||0)}`:''}</small></div><span style="color:${col(x.wr)}">${pc(x.wr)}</span>${isW&&(p0[x.b]||0)<.04?'<em>NEW</em>':''}</div>`).join('')||'<p class="nt">No games.</p>';
  // maps
  const M0=mapStats(t,pre).filter(x=>x.n>=5).sort((a,b)=>b.wr-a.wr||b.n-a.n),M1=mapStats(t,wc).sort((a,b)=>b.wr-a.wr||b.n-a.n),prac={};mapStats(t,pre).forEach(x=>prac[x.m]=x);
  const mrow=(x,k,isW)=>`<div class="mp ${k}">${mimg(x.m)}<div><b>${esc(x.m)}</b><small>${isW?`${x.w}-${x.n-x.w} at Worlds · practised ${prac[x.m]?prac[x.m].n+' sets ('+pc(prac[x.m].wr)+')':'0 sets'}`:x.n+' sets'}</small></div><span style="color:${col(x.wr)}">${pc(x.wr)}</span></div>`;
  const best=M0.slice(0,3),worst=M0.length>3?M0.slice(-Math.min(3,M0.length-3)):[];
  return `<div class="ov" data-act="close"><div class="box" role="dialog"><div class="hd">${logo(t,'lgx')}<div><h3>${esc(t)}</h3><small>${esc(r.reg)} · Placement ${r.pl} · Series ${r.ser[0]}-${r.ser[1]}</small></div>
<div class="kk"><div><small>Before Worlds</small><b style="color:${col(r.b.p)}">${pc(r.b.p)}</b><em>${r.b.n} sets</em></div><span>→</span><div><small>At Worlds</small><b style="color:${col(r.c.p)}">${pc(r.c.p)}</b><em>${r.c.n} sets</em></div><div><small>Difference</small>${r.d==null?'<b>–</b>':sg(r.d)}</div><div><small>Arrival rating</small><b style="color:#fde68a">${r.rt==null?'–':r.rt}</b></div></div><a class="x" data-act="close">✕</a></div>
<h4>Win rate day by day <i>${UI.vs==='w'?'before Worlds: only vs Worlds teams':'before Worlds: all rivals'} · big dots = Worlds</i></h4>${ch}
<div class="cols"><div><h4>Brawlers · before Worlds</h4>${brRow(B0.L,0)}</div><div><h4>Brawlers · at Worlds</h4>${brRow(B1.L,1)}</div>
<div><h4>Maps · before Worlds <i>best / worst (5+ sets)</i></h4>${best.map(x=>mrow(x,'up')).join('')}${worst.map(x=>mrow(x,'dn')).join('')||''}
<h4 style="margin-top:16px">Maps · at Worlds</h4>${M1.map(x=>mrow(x,x.wr>=.5?'up':'dn',1)).join('')||'<p class="nt">No sets.</p>'}</div></div></div></div>`}

// ---- meta ----
function metaTab(){
  const pre=D.S.filter(s=>s.pre&&D.isW(s.a)&&D.isW(s.b)),wc=D.S.filter(s=>s.wc);
  const agg=sets=>{const c={};let n=0;sets.forEach(s=>s.g.forEach(g=>{[[g.ba,g.y],[g.bb,1-g.y]].forEach(([L,y])=>{if(!D.isW(L===g.ba?g.a:g.b))return;n++;L.forEach(b=>{const e=c[b]||(c[b]={n:0,w:0});e.n++;e.w+=y})})}));const o={};for(const b in c)o[b]={p:c[b].n/n,wr:c[b].w/c[b].n,n:c[b].n};return o};
  const A=agg(pre),B=agg(wc),all=[...new Set([...Object.keys(A),...Object.keys(B)])];
  let L=all.map(b=>({b,pa:A[b]?A[b].p:0,wa:A[b]?A[b].wr:null,na:A[b]?A[b].n:0,pw:B[b]?B[b].p:0,ww:B[b]?B[b].wr:null,nw:B[b]?B[b].n:0})).map(x=>({...x,dp:x.pw-x.pa}));
  L=L.filter(x=>x.pa>=.01||x.pw>=.01);
  const k=UI.msort,dir=UI.mdir;L.sort((x,z)=>{const a=k==='b'?x.b:x[k],b=k==='b'?z.b:z[k];if(a==null&&b==null)return 0;if(a==null)return 1;if(b==null)return -1;return (a<b?-1:a>b?1:0)*dir});
  const th=(key,lab,cls)=>`<th class="${cls||''} so ${UI.msort===key?'on':''}" data-msort="${key}">${lab}${UI.msort===key?(UI.mdir<0?' ▾':' ▴'):''}</th>`;
  const tier=(o,ttl)=>{const T=Object.entries(o).filter(([b,e])=>e.p>=.03).map(([b,e])=>({b,p:e.p,wr:e.wr,n:e.n})).sort((x,z)=>z.p-x.p).slice(0,18);
    T.forEach((x,i)=>x.r=i);const rows=[['S',x=>x.r<3],['A',x=>x.r>=3&&x.r<8],['B',x=>x.r>=8&&x.r<13],['C',x=>x.r>=13]];
    return `<div class="tier"><h4>${ttl}</h4>${rows.map(([n,f])=>{const q=T.filter(f);return q.length?`<div class="tr"><span class="tl t${n}">${n}</span><div>${q.map(x=>`<span class="ti" title="${esc(title(x.b))}: picked in ${pc(x.p)} of games, ${pc(x.wr)} WR">${bimg(x.b)}<em style="color:${col(x.wr)}">${pc(x.p)}</em></span>`).join('')}</div></div>`:''}).join('')}</div>`};
  // maps of Worlds: how much they were practised
  const wm={};wc.forEach(s=>{const e=wm[s.m]||(wm[s.m]={n:0,mode:s.mode});e.n++});
  const mp=Object.entries(wm).map(([m,e])=>{const ps=pre.filter(s=>s.m===m);return {m,mode:e.mode,n:e.n,ps:ps.length}}).sort((a,b)=>b.n-a.n);
  return `<div class="grid2"><section class="card"><div class="ch"><h2>Brawlers: before vs at Worlds</h2><span class="nt">Games between Worlds teams. Pick = % of team-games with that brawler.</span></div>
<div class="tw"><table class="t mt"><thead><tr>${th('b','Brawler','l')}${th('pa','Pick before')}${th('wa','WR before')}${th('pw','Pick at Worlds')}${th('ww','WR at Worlds')}${th('dp','Change in pick')}</tr></thead><tbody>
${L.map(x=>`<tr><td class="l"><span class="tm">${bimg(x.b)}<b>${esc(title(x.b))}</b></span></td><td><span class="v">${pc(x.pa)}</span><em>${x.na} games</em></td><td><span class="v" style="color:${col(x.wa)}">${pc(x.wa)}</span></td><td><span class="v">${pc(x.pw)}</span><em>${x.nw} games</em></td><td><span class="v" style="color:${col(x.ww)}">${pc(x.ww)}</span></td><td>${sg(x.dp)}</td></tr>`).join('')}</tbody></table></div></section>
<div><section class="card">${tier(A,'Tier list · before Worlds')}${tier(B,'Tier list · at Worlds')}<p class="nt">Tier by how much each brawler was picked: S = top 3, A = next 5, B = next 5, C = next 5. The number under each brawler is its pick rate, coloured by win rate.</p></section>
<section class="card" style="margin-top:18px"><div class="ch"><h2>Worlds maps: how much were they practised?</h2></div><table class="t mt"><thead><tr><th class="l">Map</th><th>Sets at Worlds</th><th>Sets practised before<br>(between Worlds teams)</th></tr></thead><tbody>
${mp.map(x=>`<tr><td class="l"><span class="tm">${mimg(x.m)}<b>${esc(x.m)}</b></span></td><td><span class="v">${x.n}</span></td><td><span class="v">${x.ps}</span></td></tr>`).join('')}</tbody></table></section></div></div>`}

function checkTab(){
  const bad=D.check.filter(x=>!x.ok);
  return `<section class="card"><div class="ch"><h2>Data check: Worlds series vs Liquipedia</h2><span class="nt">${D.games.toLocaleString('en')} games read · ${D.S.length.toLocaleString('en')} sets · ${D.fixed} Worlds sets the API saw only partly were completed with the Liquipedia score</span></div>
<p class="nt" style="margin:0 0 12px">${bad.length?`<b style="color:#f87171">${bad.length} series do not match</b>: the API is missing games of those sets, so their Worlds win rate can be slightly off.`:'<b style="color:#4ade80">Every series matches Liquipedia.</b>'}</p>
<table class="t mt"><thead><tr><th class="l">Series</th><th>Liquipedia</th><th>From the games</th><th></th></tr></thead><tbody>
${D.check.map(x=>`<tr><td class="l"><span class="tm">${logo(x.A)}<b>${esc(x.A)}</b><i class="vsx">vs</i>${logo(x.B)}<b>${esc(x.B)}</b></span></td><td><span class="v">${x.sa}-${x.sb}</span></td><td><span class="v">${x.xa}-${x.xb}</span></td><td>${x.ok?'<b style="color:#4ade80">✓</b>':'<b style="color:#f87171">✗</b>'}</td></tr>`).join('')}</tbody></table></section>`}

function render(){
  const app=$('app');if(!D)return;
  const body=UI.tab==='tm'?teamsTab():UI.tab==='mt'?metaTab():UI.tab==='ck'?checkTab():overview();
  app.innerHTML=header()+`<main>${body}</main>`+(UI.team?popup(UI.team):'');
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-tab],[data-vs],[data-sort],[data-msort],[data-team],[data-act]');if(!a||!D)return;
  if(a.dataset.act==='close'){if(e.target.closest('.box')&&!e.target.closest('.x'))return;UI.team=null;render();return}
  if(a.dataset.act==='logout'){store.del('w25:u');store.del('w25:p');location.reload();return}
  if(a.dataset.tab){UI.tab=a.dataset.tab;save();render();window.scrollTo(0,0);return}
  if(a.dataset.vs){UI.vs=a.dataset.vs;save();render();return}
  if(a.dataset.sort){const k=a.dataset.sort;if(UI.sort===k)UI.dir=-UI.dir;else{UI.sort=k;UI.dir=k==='t'?1:-1}render();return}
  if(a.dataset.msort){const k=a.dataset.msort;if(UI.msort===k)UI.mdir=-UI.mdir;else{UI.msort=k;UI.mdir=k==='b'?1:-1}render();return}
  if(a.dataset.team&&!e.target.closest('.box')){UI.team=a.dataset.team;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.team){UI.team=null;render()}});

// ====== access: username + password + one browser per user ======
function devId(){let d=store.get('w25:dev');if(!d){d=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,'');store.set('w25:dev',d)}return d}
function gate(msg,busy){const u=store.get('w25:u')||'';
  $('app').innerHTML=`<div id="gate"><form class="gbox" autocomplete="off"><div class="brand"><span class="dot"></span>WORLDS 2025</div><p>Arrival vs stage · private access</p>
${busy?`<p class="gwait">${esc(busy)}</p>`:`<input name="u" placeholder="Username" value="${esc(u)}" spellcheck="false" autocapitalize="off"><input name="p" type="password" placeholder="Password"><button type="submit">Enter</button>`}<div class="gerr">${esc(msg||'')}</div></form></div>`;
  const f=$('app').querySelector('form');if(busy)return;const inp=f.querySelector(u?'[name=p]':'[name=u]');setTimeout(()=>inp&&inp.focus(),50);
  f.onsubmit=ev=>{ev.preventDefault();const U=f.u.value.trim(),P=f.p.value;if(!U||!P)return;login(U,P)}}
async function login(u,p){
  gate('','Loading the 2025 games… (a few seconds)');
  let j=null;
  try{
    if(window.__W25TEST)j=await window.__W25TEST({user:u,pass:p,dev:devId()});
    else{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),90000);
      const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'data',user:u,pass:p,dev:devId()}),signal:ac.signal});clearTimeout(tm);j=await res.json()}
  }catch(e){gate('Could not reach the sheet. Check your connection and try again.');return}
  if(!j||!j.ok){store.del('w25:p');
    gate(j&&j.error==='device'?'This user is already linked to another browser. Ask the admin to unlock it.':j&&j.error==='login'?'Wrong username or password.':'The sheet answered with an error: '+(j&&j.error||'unknown'));return}
  store.set('w25:u',u);store.set('w25:p',p);window.__W25USER=j.user||u;
  try{process(j.partidas||[],j.equipos||[]);render()}catch(e){console.error(e);gate('The games could not be processed: '+(e&&e.message||e))}
}
const su=store.get('w25:u'),sp=store.get('w25:p');
if(su&&sp)login(su,sp);else gate();
})();
</script></body></html>
